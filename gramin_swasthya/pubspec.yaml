name: gramin_swasthya
description: "Rural family health records app for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^15.1.2

  # Storage & DB
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  path: ^1.9.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # Device & Media
  image_picker: ^1.1.0
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.3.1
  gallery_saver_plus: ^3.2.9  # gallery_saver is unmaintained; using gallery_saver_plus as equivalent replacement

  # Utility & Misc
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.1
  flutter_tts: ^4.0.2
  android_alarm_manager_plus: ^4.0.3
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.0
  share_plus: ^10.0.2
  url_launcher: ^6.2.5
  smooth_page_indicator: ^1.2.0
  connectivity_plus: ^6.0.3
  animations: ^2.0.11
  uuid: ^4.4.0
  crypto: ^3.0.3
  flutter_svg: ^2.1.0
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
