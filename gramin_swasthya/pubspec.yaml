name: gramin_swasthya
description: "Rural family health records app for India"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Storage & DB
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  path: ^1.9.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.1
  firebase_storage: ^11.7.0

  # Device & Media
  local_auth: ^2.1.8
  image_picker: ^1.1.0
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.3.1
  gallery_saver_plus: ^3.2.9  # gallery_saver is unmaintained; using gallery_saver_plus as equivalent replacement

  # Utility & Misc
  flutter_local_notifications: ^17.1.1
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.1
  flutter_tts: ^4.0.2
  android_alarm_manager_plus: ^4.0.1
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.5
  smooth_page_indicator: ^1.1.0
  connectivity_plus: ^6.0.3
  animations: ^2.0.11
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
